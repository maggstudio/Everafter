name: Import premium editorial photography
on:
  push:
    branches: [main]
    paths: ['scripts/import-premium-photos.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/import-premium-photos.py
      - run: |
          git config user.name "wedly-photo-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/invitation-photos lib/imported-invitation-photos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import verified-resolution Pexels wedding decor assets"
          git push origin HEAD:main
