name: Import invitation photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-invitation-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - name: Download and validate photographs
        run: |
          python - <<'PY'
          import urllib.request, pathlib, io
          from PIL import Image, ImageOps
          photos = {'ringsrose':33741754,'ringsbox':32147285,'whitebouquet':36413331,'tableflowers':24023466,'candledecor':16120245,'goldrings':4180047}
          root=pathlib.Path('public/invitation-photos')
          root.mkdir(parents=True,exist_ok=True)
          for key,id in photos.items():
              url=f'https://images.pexels.com/photos/{id}/pexels-photo-{id}.jpeg?auto=compress&cs=tinysrgb&w=1600'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  data=response.read(15000000)
              with Image.open(io.BytesIO(data)) as original:
                  image=ImageOps.exif_transpose(original).convert('RGB')
                  image.thumbnail((1600,1600))
                  if min(image.size)<300: raise ValueError(key)
                  image.save(root/(key+'.webp'),'WEBP',quality=82)
          p=pathlib.Path('lib/studio-demo-media.ts')
          s=p.read_text()
          old="'https://images.pexels.com/photos/'+id+'/pexels-photo-'+id+'.jpeg?auto=compress&cs=tinysrgb&w=1200'"
          new="'/invitation-photos/'+key+'.webp'"
          if old not in s and new not in s: raise ValueError('Unexpected media registry')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit local photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/invitation-photos lib/studio-demo-media.ts
          git diff --cached --quiet && exit 0
          git commit -m "Store invitation photographs locally as WebP"
          git pull --rebase origin main
          git push origin HEAD:main
